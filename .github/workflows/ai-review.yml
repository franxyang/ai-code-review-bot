name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      provider:
        description: 'AI Provider (gemini, claude, openai)'
        required: false
        default: 'gemini'

jobs:
  review:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install -g ai-review@latest || npm install -g .
      
      - name: Run AI Code Review
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Get the base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          # Review the changes
          ai-review review --commit $HEAD_SHA > review-output.txt 2>&1 || true
          
          # Save output for comment
          cat review-output.txt
      
      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            let reviewOutput = '';
            try {
              reviewOutput = fs.readFileSync('review-output.txt', 'utf8');
            } catch (error) {
              reviewOutput = 'Failed to read review output';
            }
            
            // Check if there's already a comment from this action
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🤖 AI Code Review')
            );
            
            const commentBody = `## 🤖 AI Code Review

\`\`\`
${reviewOutput}
\`\`\`

---
*Powered by [AI Code Review Bot](https://github.com/franxyang/ai-code-review-bot)*
`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
      
      - name: Upload review report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-report
          path: .ai-review/reports/
          retention-days: 30
